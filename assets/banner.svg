<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2980">
        <animate attributeName="stop-color" values="#1A2980;#26D0CE;#1A2980" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#26D0CE">
        <animate attributeName="stop-color" values="#26D0CE;#1A2980;#26D0CE" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="15" />
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" alignment-baseline="middle">
    Awesome Warranty Management
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
  </text>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="20" fill="#f0f0f0" text-anchor="middle" alignment-baseline="middle">
    The ultimate curated list of tools and open-source projects
  </text>
</svg>
